<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Menu - QAM4</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <!-- We need to import JQUERY Library to make the api call-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="script.js"></script>
  </head>
  <body onload="init()">

    <header>
      <h1>QAM4 Menu</h1>
      <nav><a href="index.html">About →</a></nav>
    </header>

    <div class="controls">
      <input id="searchBox" type="text" placeholder="Search items..." oninput="filterCards()">
      <div class="buttons">
        <button class="filterBtn active" onclick="filterByCategory('All', this)">All</button>
        <button class="filterBtn" onclick="filterByCategory('Main Course', this)">Main</button>
        <button class="filterBtn" onclick="filterByCategory('Dessert', this)">Desserts</button>
        <button class="filterBtn" onclick="filterByCategory('Drinks', this)">Drinks</button>
      </div>
    </div>

    <div id="output"></div>

  </body>
</html>
